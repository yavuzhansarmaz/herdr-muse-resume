[package]
name = "herdr-muse-resume"
version = "0.4.0"
edition = "2021"
description = "Resume Muse sessions in restored Herdr panes after a server restart (Codex-like behavior)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
wait-timeout = "0.2"

[profile.release]
strip = true

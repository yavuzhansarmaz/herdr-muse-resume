id = "muse.resume"
name = "Muse Resume"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Resume Muse sessions in restored panes after a Herdr server restart (Codex-like behavior)"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[startup]]
command = ["./target/release/herdr-muse-resume"]
